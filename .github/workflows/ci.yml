name: CI

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "resources/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "resources/**"

jobs:
  build:
    name: Build and Test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Ninja
        uses: ashutoshvarma/setup-ninja@master

      - name: Set up LLVM
        shell: pwsh
        run: |
          choco install llvm --version=22.1.8 -y
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Print compiler versions
        shell: pwsh
        run: |
          where clang-cl
          clang-cl --version
          where cmake
          cmake --version
          where ninja
          ninja --version

      - name: Build
        run: >
          python scripts/commands/build.py
          --clean
          --build-only
          all
          Release
          -DCMAKE_C_COMPILER=clang-cl
          -DCMAKE_CXX_COMPILER=clang-cl
          -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON

      - name: Test
        run: python scripts/commands/build.py --test-only all Release

      - name: Audit
        run: python scripts/commands/build.py --audit-only all Release
